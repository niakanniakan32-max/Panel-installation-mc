# HTTP vhost for the panel installer.
# Serves ACME challenges on port 80, redirects everything else to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    root /var/www/html;
    location /.well-known/acme-challenge/ {
        allow all;
    }
    location / {
        return 301 {{HTTPS_URL}}$request_uri;
    }
}
